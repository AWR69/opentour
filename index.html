<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OpenTour Guide</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OpenTour">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-card: rgba(255, 255, 255, 0.96);
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
      --success: #16a34a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      background: #0f172a;
    }

    #map { height: 100%; width: 100%; z-index: 1; }

    /* Top Bar: Standortüberschreibung (Suche) & Schnellschalter */
    .top-container {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .search-box {
      display: flex;
      gap: 6px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px 10px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      align-items: center;
    }

    .search-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
    }

    .search-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .action-bar {
      display: flex;
      gap: 6px;
      justify-content: space-between;
    }

    .pill-btn {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: var(--shadow);
      cursor: pointer;
    }

    .pill-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .pill-btn.auto-on {
      background: #ecfdf5;
      color: var(--success);
      border-color: #86efac;
    }

    /* GPS Re-Center Button */
    .fab-gps {
      position: fixed;
      bottom: 80px;
      right: 14px;
      z-index: 1500;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: var(--shadow);
      cursor: pointer;
    }

    /* Floating Card / Sheet für Audio & Infos */
    .info-card {
      position: fixed;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 10px;
      right: 10px;
      z-index: 2000;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: all 0.25s ease-out;
      overflow: hidden;
      max-height: 60vh;
      display: flex;
      flex-direction: column;
    }

    .info-card.hidden {
      display: none;
    }

    .card-header {
      padding: 10px 14px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .card-header-left {
      flex: 1;
      min-width: 0;
    }

    .poi-title {
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .poi-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .close-btn {
      background: #f1f5f9;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 8px;
    }

    .card-body {
      padding: 10px 14px 14px;
      overflow-y: auto;
    }

    /* Audioplayer Leiste */
    .audio-player {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--text);
    }

    .play-btn {
      background: var(--primary);
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .speed-btn {
      font-size: 0.75rem;
      font-weight: 700;
      background: #e2e8f0;
      padding: 3px 6px;
      border-radius: 6px;
      border: none;
    }

    .poi-desc {
      font-size: 0.85rem;
      line-height: 1.45;
      color: #334155;
    }

    /* Listen Modal */
    .list-container {
      display: none;
      max-height: 50vh;
      overflow-y: auto;
      padding: 10px;
      flex-direction: column;
      gap: 6px;
    }

    .list-item {
      background: #fff;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="top-container">
    <div class="search-box">
      <span style="font-size:0.9rem;">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Standort überschreiben (Stadt, Ort)..." onkeydown="if(event.key==='Enter') searchLocation()">
      <button class="search-btn" onclick="searchLocation()">Go</button>
    </div>

    <div class="action-bar">
      <button class="pill-btn" id="autoAudioBtn" onclick="toggleAutoAudio()">
        <span id="autoAudioIcon">🎧</span> Auto-Audio: <span id="autoAudioStatus">AUS</span>
      </button>
      <button class="pill-btn" id="listBtn" onclick="toggleListView()">📋 Touren & Highlights</button>
    </div>
  </div>

  <div class="fab-gps" onclick="locateUser(true)" title="Zu meinem GPS">🎯</div>

  <div id="map"></div>

  <div class="info-card hidden" id="infoCard">
    <div class="card-header">
      <div class="card-header-left">
        <div class="poi-title" id="cardTitle">Titel</div>
        <div class="poi-sub" id="cardSub">Distanz • Typ</div>
      </div>
      <button class="close-btn" onclick="closeCard()">✕</button>
    </div>

    <div class="card-body">
      <div class="audio-player">
        <button class="ctrl-btn" onclick="skipSpeech(-15)">⏪ -15s</button>
        <button class="ctrl-btn play-btn" id="playBtn" onclick="toggleAudio()">▶</button>
        <button class="ctrl-btn" onclick="skipSpeech(15)">⏩ +15s</button>
        <button class="speed-btn" id="speedBtn" onclick="toggleSpeed()">1.0x</button>
      </div>
      <p class="poi-desc" id="cardDesc">Beschreibung lädt...</p>
    </div>
  </div>

  <div class="info-card hidden" id="tourListCard">
    <div class="card-header">
      <div class="card-header-left">
        <div class="poi-title">Entdeckte Highlights</div>
        <div class="poi-sub" id="tourListCount">0 Orte in Reichweite</div>
      </div>
      <button class="close-btn" onclick="toggleListView()">✕</button>
    </div>
    <div class="list-container" id="listContainer" style="display:flex;"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, userMarker, userCircle;
    let currentPos = [49.4432, 1.0999]; // Rouen Fallback
    let loadedPOIs = [];
    let poiMarkers = [];
    let activePOI = null;
    let autoAudioActive = false;
    let lastPlayedPoiId = null;

    // TTS Audio State
    let synth = window.speechSynthesis;
    let utterance = null;
    let isPlaying = false;
    let playbackSpeed = 1.0;

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView(currentPos, 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      // Nachladen beim Verschieben (mit sanfter Entprellung)
      let moveTimer;
      map.on('moveend', () => {
        clearTimeout(moveTimer);
        moveTimer = setTimeout(() => fetchPOIsInArea(), 400);
      });

      locateUser(false);
      fetchPOIsInArea();
    }

    // 1. Standortüberschreibung (Suche) wie im SelfTour-Handbuch
    async function searchLocation() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (data && data.length > 0) {
          const target = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
          map.setView(target, 16);
          fetchPOIsInArea();
        } else {
          alert('Ort nicht gefunden.');
        }
      } catch (e) {
        console.error("Geocoding Error:", e);
      }
    }

    // 2. Automatisches Audio Toggle
    function toggleAutoAudio() {
      autoAudioActive = !autoAudioActive;
      const btn = document.getElementById('autoAudioBtn');
      const status = document.getElementById('autoAudioStatus');
      
      if (autoAudioActive) {
        btn.classList.add('auto-on');
        status.textContent = 'AN';
        // AudioContext für iOS entsperren
        if (synth.speaking) synth.cancel();
      } else {
        btn.classList.remove('auto-on');
        status.textContent = 'AUS';
      }
    }

    // 3. POIs via Overpass API laden
    async function fetchPOIsInArea() {
      const center = map.getCenter();
      const radius = 900;

      const query = `
        [out:json][timeout:12];
        (
          nwr["tourism"~"attraction|museum|viewpoint|artwork"](around:${radius},${center.lat},${center.lng});
          nwr["historic"~"monument|memorial|castle|ruins|church|cathedral"](around:${radius},${center.lat},${center.lng});
          nwr["amenity"="place_of_worship"]["historic"](around:${radius},${center.lat},${center.lng});
        );
        out center 30;
      `;

      try {
        const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
        const data = await res.json();

        clearMarkers();
        loadedPOIs = [];

        data.elements.forEach(el => {
          const lat = el.lat || (el.center && el.center.lat);
          const lng = el.lon || (el.center && el.center.lon);
          const name = el.tags && (el.tags.name || el.tags['name:de'] || el.tags['name:en']);

          if (lat && lng && name) {
            const poi = {
              id: el.id,
              name: name,
              lat: lat,
              lng: lng,
              type: el.tags.tourism || el.tags.historic || 'Highlight',
              desc: el.tags.description || el.tags['description:de'] || null,
              wikipedia: el.tags.wikipedia || null
            };
            loadedPOIs.push(poi);
            renderMarker(poi);
          }
        });

        document.getElementById('tourListCount').textContent = `${loadedPOIs.length} Highlights in Reichweite`;
        updateListView();
      } catch (e) {
        console.error("Overpass API Error:", e);
      }
    }

    function clearMarkers() {
      poiMarkers.forEach(m => map.removeLayer(m));
      poiMarkers = [];
    }

    function renderMarker(poi) {
      const marker = L.marker([poi.lat, poi.lng]).addTo(map);
      marker.on('click', () => selectPOI(poi, true));
      poiMarkers.push(marker);
    }

    // 4. POI auswählen & Audiotext laden
    async function selectPOI(poi, openCard = true) {
      activePOI = poi;
      stopAudio();

      if (openCard) {
        document.getElementById('tourListCard').classList.add('hidden');
        const card = document.getElementById('infoCard');
        card.classList.remove('hidden');

        document.getElementById('cardTitle').textContent = poi.name;
        const dist = Math.round(calcDistance(currentPos[0], currentPos[1], poi.lat, poi.lng));
        document.getElementById('cardSub').textContent = `${dist} m entfernt • ${poi.type.toUpperCase()}`;
        document.getElementById('cardDesc').textContent = 'Lade Audio-Erklärung...';
      }

      let text = poi.desc;
      if (!text) {
        text = await fetchWikipediaSummary(poi.name, poi.wikipedia);
      }

      poi.fullText = text || `Willkommen bei ${poi.name}. Es handelt sich um ein historisches Bauwerk bzw. eine Sehenswürdigkeit in dieser Region.`;
      
      if (openCard) {
        document.getElementById('cardDesc').textContent = poi.fullText;
      }

      // Falls Automatisches Audio aktiv ist und wir getriggert wurden:
      if (autoAudioActive && lastPlayedPoiId !== poi.id) {
        lastPlayedPoiId = poi.id;
        toggleAudio();
      }
    }

    async function fetchWikipediaSummary(title, wikiTag) {
      try {
        let pageTitle = title;
        let lang = 'de';
        if (wikiTag && wikiTag.includes(':')) {
          lang = wikiTag.split(':')[0];
          pageTitle = wikiTag.split(':')[1];
        }
        const res = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(pageTitle)}`);
        if (!res.ok) return null;
        const data = await res.json();
        return data.extract || null;
      } catch {
        return null;
      }
    }

    // 5. Audio-Engine
    function toggleAudio() {
      if (!activePOI || !activePOI.fullText) return;

      if (synth.speaking) {
        if (isPlaying) {
          synth.pause();
          isPlaying = false;
          document.getElementById('playBtn').textContent = '▶';
        } else {
          synth.resume();
          isPlaying = true;
          document.getElementById('playBtn').textContent = '⏸';
        }
      } else {
        utterance = new SpeechSynthesisUtterance(activePOI.fullText);
        utterance.lang = 'de-DE';
        utterance.rate = playbackSpeed;
        utterance.onend = () => {
          isPlaying = false;
          document.getElementById('playBtn').textContent = '▶';
        };
        synth.speak(utterance);
        isPlaying = true;
        document.getElementById('playBtn').textContent = '⏸';
      }
    }

    function stopAudio() {
      if (synth.speaking) synth.cancel();
      isPlaying = false;
      document.getElementById('playBtn').textContent = '▶';
    }

    function toggleSpeed() {
      const speeds = [1.0, 1.25, 1.5];
      playbackSpeed = speeds[(speeds.indexOf(playbackSpeed) + 1) % speeds.length];
      document.getElementById('speedBtn').textContent = `${playbackSpeed}x`;
      if (synth.speaking) {
        stopAudio();
        toggleAudio();
      }
    }

    function skipSpeech() {
      if (synth.speaking) {
        stopAudio();
        toggleAudio();
      }
    }

    function closeCard() {
      stopAudio();
      document.getElementById('infoCard').classList.add('hidden');
    }

    // 6. Geofencing & Freihändige Erkundung
    function locateUser(center = false) {
      if (!navigator.geolocation) return;

      navigator.geolocation.watchPosition((pos) => {
        const { latitude, longitude, accuracy } = pos.coords;
        currentPos = [latitude, longitude];

        if (!userMarker) {
          userMarker = L.circleMarker(currentPos, { radius: 8, fillColor: '#2563eb', color: '#fff', weight: 3, fillOpacity: 1 }).addTo(map);
          userCircle = L.circle(currentPos, { radius: accuracy, color: '#2563eb', weight: 1, fillOpacity: 0.08 }).addTo(map);
          if (center) map.setView(currentPos, 16);
        } else {
          userMarker.setLatLng(currentPos);
          userCircle.setLatLng(currentPos);
          userCircle.setRadius(accuracy);
          if (center) map.setView(currentPos, 16);
        }

        // Auto-Audio Geofence Trigger (< 45 Meter)
        if (autoAudioActive) {
          loadedPOIs.forEach(poi => {
            const dist = calcDistance(latitude, longitude, poi.lat, poi.lng);
            if (dist < 45 && lastPlayedPoiId !== poi.id) {
              selectPOI(poi, true);
            }
          });
        }
      }, (err) => console.warn(err.message), { enableHighAccuracy: true });
    }

    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2)**2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // 7. Touren- & Highlightliste
    function toggleListView() {
      const listCard = document.getElementById('tourListCard');
      const isHidden = listCard.classList.contains('hidden');
      if (isHidden) {
        document.getElementById('infoCard').classList.add('hidden');
        listCard.classList.remove('hidden');
      } else {
        listCard.classList.add('hidden');
      }
    }

    function updateListView() {
      const container = document.getElementById('listContainer');
      container.innerHTML = '';

      const sorted = [...loadedPOIs].sort((a, b) => {
        return calcDistance(currentPos[0], currentPos[1], a.lat, a.lng) -
               calcDistance(currentPos[0], currentPos[1], b.lat, b.lng);
      });

      sorted.forEach(poi => {
        const d = Math.round(calcDistance(currentPos[0], currentPos[1], poi.lat, poi.lng));
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div>
            <strong>${poi.name}</strong><br>
            <small style="color:var(--text-muted)">${poi.type}</small>
          </div>
          <span style="font-size:0.8rem;font-weight:700;color:var(--primary)">${d} m</span>
        `;
        item.onclick = () => {
          toggleListView();
          map.setView([poi.lat, poi.lng], 17);
          selectPOI(poi, true);
        };
        container.appendChild(item);
      });
    }

    window.onload = initMap;
  </script>
</body>
</html>
